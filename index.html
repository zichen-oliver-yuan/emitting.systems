<!DOCTYPE html>

  <style>
    @font-face { font-family: "Rag"; src: url("fonts/Rag-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Rag"; src: url("fonts/Rag-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "Rag"; src: url("fonts/Rag-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Rag"; src: url("fonts/Rag-BoldItalic.woff2") format("woff2"); font-weight: 700; font-style: italic; font-display: swap; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; background: #0059ff; }
    body { position: fixed; inset: 0; overflow: hidden; margin: 0; padding: max(1rem, 0.4em); box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font: clamp(18px, 4vw, 64px)/1.2 "Rag", Arial, Helvetica, sans-serif; color: #ffffff; background: #0059ff; }
    p { position: relative; z-index: 1; margin: 0.6em 0 0; }
    h1 { font-weight: normal; font-size: 1.2rem; }
    canvas { position: absolute; pointer-events: none; }
    ::selection { background: #d6006f; color: #ffffff; }
  </style>
</head>
<body>
  <canvas id="smoke" aria-hidden="true"></canvas>
  <p>emitting.sys<span class="chimney">t</span>ems is a collective conducting experiments with and in response to emerging and legacy tools.</p>
  <p>our curiosity lies in digital literacy, noise-making, computational imageries, and electronics.</p>
  <script>
  (() => {
    // Smoke from the "t" in "systems": square units leave the tip of the stem,
    // round off as they rise, fuse into larger clusters, and pool at the top.
    const FILL_SECONDS = 300;  // time for the cloud to reach its lowest point
    const RISE_SECONDS = 26;   // roughly how long a unit takes to reach the top
    const RATE = 5;            // units emitted per second
    const BIN = 16;            // px width of one column of the cloud's lower edge
    const STEP = 1 / 60;

    const canvas = document.getElementById('smoke');
    const ctx = canvas.getContext('2d');
    const anchor = document.querySelector('.chimney');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let W = 0, H = 0, fs = 0, M = 0, dpr = 1, capY = 0, unitVol = 0;
    let tip = { x: 0, y: 0 };
    let heights = new Float32Array(0), scratch = new Float32Array(0), edge = new Float32Array(0);
    let parts = [], time = 0, emitDebt = 0;

    function layout() {
      const old = { fs, tip, capY, heights };
      W = innerWidth; H = innerHeight;
      fs = Math.max(18, Math.min(96, Math.sqrt(W * H / 500)));
      document.body.style.fontSize = fs + 'px';
      const r = anchor.getBoundingClientRect();
      tip = { x: r.left + 0.135 * fs, y: r.top + 0.27 * fs };
      M = Math.ceil(fs);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      capY = Math.max(0, tip.y - 2.5 * fs);
      canvas.width = Math.round((W + 2 * M) * dpr);
      canvas.height = Math.round((H + 2 * M) * dpr);
      canvas.style.left = canvas.style.top = -M + 'px';
      canvas.style.width = W + 2 * M + 'px';
      canvas.style.height = H + 2 * M + 'px';
      const n = Math.ceil((W + 2 * M) / BIN) + 1;
      heights = new Float32Array(n); scratch = new Float32Array(n); edge = new Float32Array(n);
      unitVol = capY * (W + 2 * M) / (RATE * FILL_SECONDS);
      if (old.fs) {
        // Keep the existing cloud and smoke through a resize.
        const k = old.capY ? capY / old.capY : 0, on = old.heights.length;
        for (let i = 0; i < n; i++) heights[i] = old.heights[Math.min(on - 1, Math.round(i * (on - 1) / (n - 1)))] * k;
        const sc = fs / old.fs;
        for (const p of parts) {
          p.x = tip.x + (p.x - old.tip.x) * sc; p.y = tip.y + (p.y - old.tip.y) * sc;
          p.s *= sc; p.s0 *= sc; p.vx *= sc; p.vy *= sc;
        }
      }
    }

    function heightAt(x) {
      const f = Math.max(0, Math.min(heights.length - 1.001, (x + M) / BIN));
      const i = f | 0, t = f - i;
      return heights[i] * (1 - t) + heights[i + 1] * t;
    }

    function deposit(x, vol, spread) {
      const a = Math.max(0, Math.floor((x - spread + M) / BIN));
      const b = Math.min(heights.length - 1, Math.ceil((x + spread + M) / BIN));
      let sum = 0;
      for (let i = a; i <= b; i++) sum += Math.max(0.05, 1 - Math.abs(i * BIN - M - x) / spread);
      for (let i = a; i <= b; i++) heights[i] += vol * Math.max(0.05, 1 - Math.abs(i * BIN - M - x) / spread) / (sum * BIN);
    }

    function spawn() {
      const s0 = 0.05 * fs;
      parts.push({
        x: tip.x + (Math.random() - 0.5) * 0.09 * fs, y: tip.y,
        vx: 0, vy: -0.08 * fs,
        s: s0, s0, age: 0, mass: 1, pooled: false,
        k: 0.85 + Math.random() * 0.3, grow: 3.5 + Math.random() * 3, ph: Math.random() * 6.283
      });
    }

    const roundness = p => {
      const t = Math.max(0, Math.min(1, (p.age - 1) / (RISE_SECONDS * 0.4)));
      return t * t * (3 - 2 * t);
    };

    function step(dt) {
      time += dt;
      emitDebt += RATE * dt * (1 + 0.9 * Math.sin(time * 2.1) * Math.sin(time * 0.7));
      while (emitDebt >= 1) { emitDebt -= 1; spawn(); }

      let total = 0;
      for (let i = 0; i < heights.length; i++) total += heights[i];
      const full = total / heights.length >= capY;

      // Nearby units pull together and, once overlapping, become one.
      for (let i = 0; i < parts.length; i++) {
        const a = parts[i];
        if (a.dead || a.age < 1.5) continue;
        for (let j = i + 1; j < parts.length; j++) {
          const b = parts[j];
          if (b.dead || b.age < 1.5) continue;
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001, reach = (a.s + b.s) * 2.6, big = Math.max(a.s, b.s);
          if (d > reach) continue;
          if (d < 0.3 * big && a.age > 3 && b.age > 3 && a.mass + b.mass <= 16) {
            const keep = a.mass >= b.mass ? a : b, gone = keep === a ? b : a, m = a.mass + b.mass;
            keep.x = (a.x * a.mass + b.x * b.mass) / m; keep.y = (a.y * a.mass + b.y * b.mass) / m;
            keep.vx = (a.vx * a.mass + b.vx * b.mass) / m; keep.vy = (a.vy * a.mass + b.vy * b.mass) / m;
            keep.mass = m; gone.dead = true;
            if (gone === a) break;
            continue;
          }
          const f = (d < 0.7 * big ? -0.5 : 1 - d / reach) * dt * 0.3 * fs / d, m = a.mass + b.mass;
          a.x += dx * f * b.mass / m; a.y += dy * f * b.mass / m;
          b.x -= dx * f * a.mass / m; b.y -= dy * f * a.mass / m;
        }
      }

      const rise = tip.y / RISE_SECONDS;
      for (const p of parts) {
        if (p.dead) continue;
        p.age += dt;
        const up = (tip.y - p.y) / fs;  // height above the tip, in ems
        p.vy += (-rise * p.k * Math.min(1, 0.3 + p.age / 6) - p.vy) * dt * 1.5;
        // Wind: a hard shove to the right straight out of the tip, then a
        // snaking current that swings left and right with height, plus gusts.
        let wind = rise * (2 * Math.exp(-up / 2.2)
          + 0.12
          + 1.5 * Math.sin(up * 0.5 - time * 0.22 - 1.2) * Math.min(1, up / 3)
          + 0.35 * Math.sin(time * 0.31 + up * 0.15)
          + 0.12 * Math.sin(time * 0.9 + p.ph));
        const pad = 1.5 * fs;
        if (p.x > W - pad) wind -= rise * 3 * (p.x - W + pad) / pad;
        if (p.x < pad) wind += rise * 3 * (pad - p.x) / pad;
        p.vx += (wind - p.vx) * dt * 1.6;
        p.x += p.vx * dt; p.y += p.vy * dt;
        const target = Math.min(0.8 * fs, p.s0 * Math.sqrt(p.mass) * (1 + p.grow * Math.pow(Math.min(1, p.age / RISE_SECONDS), 0.9)));
        p.s += (target - p.s) * dt * 2;
        const h = heightAt(p.x);
        if (!p.pooled && p.y <= h) { p.pooled = true; if (!full) deposit(p.x, p.mass * unitVol, p.s * 5); }
        if (p.y + p.s < h - 2) p.dead = true;
      }
      parts = parts.filter(p => !p.dead);

      // The pooled gas levels out slowly along the top.
      const n = heights.length;
      for (let i = 0; i < n; i++) {
        const l = heights[i ? i - 1 : 0], r = heights[i < n - 1 ? i + 1 : n - 1];
        scratch[i] = heights[i] + 0.15 * (l + r - 2 * heights[i]);
      }
      const t = heights; heights = scratch; scratch = t;
    }

    function shape(p) {
      const r = p.s * roundness(p), s = p.s, x = p.x, y = p.y;
      ctx.moveTo(x - s + r, y - s);
      ctx.arcTo(x + s, y - s, x + s, y + s, r);
      ctx.arcTo(x + s, y + s, x - s, y + s, r);
      ctx.arcTo(x - s, y + s, x - s, y - s, r);
      ctx.arcTo(x - s, y - s, x + s, y - s, r);
      ctx.closePath();
    }

    // A smooth liquid neck joining two round units that are close together.
    function bridge(a, b) {
      const r1 = a.s, r2 = b.s, d = Math.hypot(b.x - a.x, b.y - a.y), far = (r1 + r2) * 1.35;
      if (d > far || d <= Math.abs(r1 - r2) + 0.01) return;
      const v = 0.5 * Math.min(1, (far - d) / (far - (r1 + r2) * 0.85)) * Math.min(roundness(a), roundness(b));
      if (v <= 0.01) return;
      const u1 = d < r1 + r2 ? Math.acos((r1 * r1 + d * d - r2 * r2) / (2 * r1 * d)) : 0;
      const u2 = d < r1 + r2 ? Math.acos((r2 * r2 + d * d - r1 * r1) / (2 * r2 * d)) : 0;
      const ang = Math.atan2(b.y - a.y, b.x - a.x), spread = Math.acos((r1 - r2) / d);
      const a1 = ang + u1 + (spread - u1) * v, a2 = ang - u1 - (spread - u1) * v;
      const a3 = ang + Math.PI - u2 - (Math.PI - u2 - spread) * v, a4 = ang - Math.PI + u2 + (Math.PI - u2 - spread) * v;
      const p1x = a.x + r1 * Math.cos(a1), p1y = a.y + r1 * Math.sin(a1), p2x = a.x + r1 * Math.cos(a2), p2y = a.y + r1 * Math.sin(a2);
      const p3x = b.x + r2 * Math.cos(a3), p3y = b.y + r2 * Math.sin(a3), p4x = b.x + r2 * Math.cos(a4), p4y = b.y + r2 * Math.sin(a4);
      const k = Math.min(v * 2.4, Math.hypot(p1x - p3x, p1y - p3y) / (r1 + r2)) * Math.min(1, d * 2 / (r1 + r2));
      const h1 = r1 * k, h2 = r2 * k, q = Math.PI / 2;
      ctx.moveTo(p1x, p1y);
      ctx.bezierCurveTo(p1x + h1 * Math.cos(a1 - q), p1y + h1 * Math.sin(a1 - q), p3x + h2 * Math.cos(a3 + q), p3y + h2 * Math.sin(a3 + q), p3x, p3y);
      ctx.lineTo(p4x, p4y);
      ctx.bezierCurveTo(p4x + h2 * Math.cos(a4 - q), p4y + h2 * Math.sin(a4 - q), p2x + h1 * Math.cos(a2 + q), p2y + h1 * Math.sin(a2 + q), p2x, p2y);
      ctx.closePath();
    }

    function render() {
      ctx.setTransform(dpr, 0, 0, dpr, M * dpr, M * dpr);
      ctx.clearRect(-M, -M, W + 2 * M, H + 2 * M);
      ctx.fillStyle = '#fff';

      // Lower edge of the pooled cloud: a slow swell, reaching down to take in units as they arrive.
      const n = heights.length;
      for (let i = 0; i < n; i++) {
        const x = i * BIN - M, h = heights[i];
        edge[i] = h + Math.sin(x * 0.006 + time * 0.12) * Math.min(h * 0.3, 0.1 * fs);
      }
      for (const p of parts) {
        const h = heightAt(p.x), gap = p.y - p.s - h;
        let c = 1 - gap / (1.5 * p.s);
        if (c <= 0) continue;
        c = Math.min(1, c); c = c * c * (3 - 2 * c);
        const amp = c * Math.max(0, p.y - h), sig = 1.25 * p.s;
        const a = Math.max(0, Math.floor((p.x - 3 * sig + M) / BIN)), b = Math.min(n - 1, Math.ceil((p.x + 3 * sig + M) / BIN));
        for (let i = a; i <= b; i++) {
          const dx = i * BIN - M - p.x;
          edge[i] = Math.max(edge[i], heights[i] + amp * Math.exp(-dx * dx / (2 * sig * sig)));
        }
      }
      ctx.beginPath();
      ctx.moveTo(-M, -M);
      ctx.lineTo(-M, edge[0]);
      for (let i = 1; i < n - 1; i++) {
        const x = i * BIN - M;
        ctx.quadraticCurveTo(x, edge[i], x + BIN / 2, (edge[i] + edge[i + 1]) / 2);
      }
      ctx.lineTo((n - 1) * BIN - M, edge[n - 1]);
      ctx.lineTo((n - 1) * BIN - M, -M);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      for (const p of parts) shape(p);
      ctx.fill();
      ctx.beginPath();
      for (let i = 0; i < parts.length; i++)
        for (let j = i + 1; j < parts.length; j++) {
          const a = parts[i], b = parts[j];
          if (a.s >= b.s) bridge(a, b); else bridge(b, a);
        }
      ctx.fill();
    }

    layout();
    addEventListener('resize', () => { layout(); render(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); render(); });

    if (reduce) {
      for (let i = 0; i < 40 * 60; i++) step(STEP);
      render();
      return;
    }
    let last = performance.now(), acc = 0;
    requestAnimationFrame(function frame(now) {
      acc += Math.min(0.05, (now - last) / 1000); last = now;
      while (acc >= STEP) { step(STEP); acc -= STEP; }
      render();
      requestAnimationFrame(frame);
    });
  })();
  </script>
</body>
